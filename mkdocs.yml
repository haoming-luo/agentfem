site_name: AgentFEM
site_description: AI-native finite-element workflows for humans and agents.
repo_name: AgentFEM
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: logo/AgentFEM_logo_transparent.png
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Agent and GUI Integration: agent_gui_integration.md
  - Design Notes:
      - Product Roadmap: product_roadmap.md
      - Nonlinear Solid Architecture: nonlinear_solid_architecture.md
      - Nonlinear Materials: nonlinear_materials.md
      - Procedures, Thermal Stress, and Creep: solution_procedures_and_thermal_creep.md
      - Scientific Function Reference: reference/scientific_function_reference.md
      - Scientific Operator Contracts: operator_contracts.md
      - Results and Campaigns: results_and_campaigns.md
      - Stable Steps and Compact Output: step_and_output_architecture.md
      - Mesh Interoperability: mesh_interoperability.md
      - Platform and Optional Dependencies: platform_support.md
      - Abaqus Periodic Cell: abaqus_periodic_cell.md
      - Abaqus User Materials: abaqus_user_material_bridge.md
      - Module Map: module_map.md
      - API Style: api_style.md
      - Extension Rules: extension_rules.md
      - Tutorial Design: tutorial_design.md
      - Validation: validation.md
      - Scientific Trust and Verification: scientific_verification.md
      - Architecture Review: architecture_review.md
      - AIR Architecture Roadmap: air_architecture_roadmap.md
      - AI-Native Campaigns and Learning: ai_native_learning.md
      - Documentation Site: documentation_site.md
      - Licensing: licensing.md
      - Publishing: publishing.md
      - AgentFEM 0.2.0a1: release_0.2.0a1.md
      - 26 August 2026 Release Gate: release_2026_08_26.md
