site_name: AgentFEM
site_description: AI-native finite-element computing for humans and agents.
site_url: https://haoming-luo.github.io/agentfem/
repo_name: haoming-luo/agentfem
repo_url: https://github.com/haoming-luo/agentfem
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: Copyright &copy; 2026 Haoming Luo. AgentFEM is Apache-2.0 licensed.

# These records remain linkable and searchable, but they are not part of the
# primary reader journey. Keeping them out of the sidebar prevents release and
# internal design history from competing with the user manual.
not_in_nav: |
  release_0.2.0.md
  release_0.2.0a1.md
  release_0.2.0a2.md
  release_0.2.1.md
  release_0.2.2.md
  release_2026_08_26.md
  publishing.md
  development_testing.md
  project/engineering_notes.md
  architecture_review.md
  fem_foundation_audit_2026_08_05.md
  engineering_feedback_2026_08_05.md
  release_audit_2026_08_05.md
  air_architecture_roadmap.md
  ai_native_learning.md
  digital_twin_direction.md
  tutorial_design.md
  documentation_site.md

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  logo: assets/images/AgentFEM_logo_transparent.png
  favicon: assets/images/AgentFEM_logo_transparent.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - navigation.prune
    - navigation.path
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search:
      lang: en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/navigation-state.js
  - javascripts/toc-current.js
  - javascripts/mathjax.js
  - vendor/mathjax/3.2.2/tex-chtml-full.js

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/haoming-luo/agentfem
      name: AgentFEM on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agentfem/
      name: AgentFEM on PyPI
  generator: false

