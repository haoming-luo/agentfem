site_name: AgentFEM
site_description: AI-native finite-element computing for humans and agents.
site_url: https://haoming-luo.github.io/agentfem/
repo_name: haoming-luo/agentfem
repo_url: https://github.com/haoming-luo/agentfem
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: Copyright &copy; 2026 Haoming Luo. AgentFEM is Apache-2.0 licensed.

theme:
  name: material
  language: en
  font: false
  logo: assets/images/AgentFEM_logo_transparent.png
  favicon: assets/images/AgentFEM_logo_transparent.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search:
      lang: en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/navigation-state.js
  - javascripts/mathjax.js
  - vendor/mathjax/3.2.2/tex-chtml-full.js

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/haoming-luo/agentfem
      name: AgentFEM on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agentfem/
      name: AgentFEM on PyPI
  generator: false

