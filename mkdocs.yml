site_name: AgentFEM
site_description: AI-assisted finite-element simulation and agent-readable CAE workflows.
repo_name: AgentFEM
docs_dir: .
site_dir: site

theme:
  name: material
  logo: logo/AgentFEM_logo_transparent.png
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: README.md
  - Install: INSTALL.md
  - Agent Guide: AGENT_GUIDE.md
  - Workflow: WORKFLOW.md
  - Concepts: CONCEPTS.md
  - Examples:
      - Overview: examples/README.md
  - Design Notes:
      - Module Map: docs/module_map.md
      - API Style: docs/api_style.md
      - Extension Rules: docs/extension_rules.md
      - Tutorial Design: docs/tutorial_design.md
      - Validation: docs/validation.md
      - Architecture Review: docs/architecture_review.md
      - AIR Architecture Roadmap: docs/air_architecture_roadmap.md
      - AI-Native Campaigns and Learning: docs/ai_native_learning.md
      - Documentation Site: docs/documentation_site.md
  - Skill:
      - AgentFEM Skill: skills/agentfem/SKILL.md
      - Skill Workflow: skills/agentfem/references/workflow.md
      - Skill Concepts: skills/agentfem/references/concepts.md
      - Skill Module Map: skills/agentfem/references/module_map.md
      - Skill Validation: skills/agentfem/references/validation.md
      - Skill Extension Rules: skills/agentfem/references/extension_rules.md
