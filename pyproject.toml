[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfem"
version = "0.1.0"
description = "Agent-oriented finite-element workflow tools built on DOLFINx/PETSc."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Haoming Luo" }
]
dependencies = [
  "numpy",
  "mpi4py",
]

[project.optional-dependencies]
mesh-formats = ["meshio"]
docs = ["mkdocs", "mkdocs-material", "pymdown-extensions"]
notebooks = ["jupyterlab", "ipykernel", "nbformat", "nbclient"]

[tool.setuptools]
package-dir = { "agentfem" = "." }
packages = [
  "agentfem",
  "agentfem.benchmarks",
  "agentfem.boundary_models",
  "agentfem.constitutive",
  "agentfem.elements",
  "agentfem.kernel",
  "agentfem.materials",
  "agentfem.mesh",
  "agentfem.operators",
]

[tool.setuptools.package-data]
"agentfem.materials" = ["data/*.json"]
