[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfem"
version = "0.1.3"
description = "AI-assisted finite-element simulation and agent-readable CAE workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Haoming Luo" }
]
keywords = [
  "finite-element-method",
  "fem",
  "CAE",
  "FEniCSx",
  "DOLFINx",
  "AI-assisted-simulation",
  "agent-readable-workflow",
  "scientific-computing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy",
  "mpi4py",
]

[project.urls]
Homepage = "https://github.com/haoming-luo/agentfem"
Repository = "https://github.com/haoming-luo/agentfem"
Issues = "https://github.com/haoming-luo/agentfem/issues"
Documentation = "https://github.com/haoming-luo/agentfem#readme"

[project.optional-dependencies]
mesh-formats = ["meshio"]
docs = ["mkdocs", "mkdocs-material", "pymdown-extensions"]
notebooks = ["jupyterlab", "ipykernel", "nbformat", "nbclient"]
dev = ["build", "twine"]

[tool.setuptools]
package-dir = { "agentfem" = "." }
packages = [
  "agentfem",
  "agentfem.benchmarks",
  "agentfem.boundary_models",
  "agentfem.constraints",
  "agentfem.constitutive",
  "agentfem.elements",
  "agentfem.kernel",
  "agentfem.materials",
  "agentfem.materials.data",
  "agentfem.mesh",
  "agentfem.operators",
  "agentfem.time",
]

[tool.setuptools.package-data]
"agentfem.materials" = ["data/*.json"]
