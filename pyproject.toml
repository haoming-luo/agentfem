[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfem"
version = "0.2.3"
description = "AI-native finite-element workflows for humans and agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Haoming Luo" }
]
keywords = [
  "finite-element-method",
  "fem",
  "CAE",
  "FEniCSx",
  "DOLFINx",
  "AI-assisted-simulation",
  "agent-readable-workflow",
  "scientific-computing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "h5py",
  "numpy",
  "mpi4py",
]

[project.urls]
Homepage = "https://github.com/haoming-luo/agentfem"
Repository = "https://github.com/haoming-luo/agentfem"
Issues = "https://github.com/haoming-luo/agentfem/issues"
Documentation = "https://haoming-luo.github.io/agentfem/"
Changelog = "https://github.com/haoming-luo/agentfem/blob/main/CHANGELOG.md"

[project.scripts]
agentfem = "agentfem.cli:main"

[project.optional-dependencies]
mesh-formats = ["meshio"]
gmsh = ["gmsh>=4.11"]
visualization = [
  "meshio",
  "pyvista",
  "pillow",
  "matplotlib",
  "imageio",
  "imageio-ffmpeg",
]
parallel-mpc = ["dolfinx_mpc>=0.11,<0.12"]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9,<10",
  "pymdown-extensions",
  "mike",
]
notebooks = ["jupyterlab", "ipykernel", "nbformat", "nbclient"]
ml = ["torch"]
dev = ["build", "pytest", "ruff>=0.16,<0.17", "twine"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = [
  "agentfem",
  "agentfem.benchmarks",
  "agentfem.backends",
  "agentfem.boundary_models",
  "agentfem.campaigns",
  "agentfem.constraints",
  "agentfem.constitutive",
  "agentfem.datasets",
  "agentfem.elements",
  "agentfem.kernel",
  "agentfem.learning",
  "agentfem.knowledge",
  "agentfem.knowledge.benchmarks",
  "agentfem.knowledge.cards",
  "agentfem.knowledge.decisions",
  "agentfem.knowledge.external_data",
  "agentfem.knowledge.research_tasks",
  "agentfem.knowledge.schema",
  "agentfem.ir",
  "agentfem.integrations",
  "agentfem.integrations.pdeagent_bench",
  "agentfem.materials",
  "agentfem.materials.data",
  "agentfem.mechanics",
  "agentfem.mesh",
  "agentfem.operators",
  "agentfem.results",
  "agentfem.release",
  "agentfem.surrogates",
  "agentfem.time",
  "agentfem.templates",
]

[tool.setuptools.package-data]
"agentfem.materials" = ["data/*.json"]
"agentfem.knowledge" = [
  "README.md",
  "catalog.json",
  "cards/*.json",
  "benchmarks/*.json",
  "schema/*.json",
  "decisions/*.md",
  "external_data/*.json",
  "research_tasks/*.json",
]
"agentfem" = ["py.typed", "release/*.json"]
"agentfem.templates" = ["*/case.py", "*/agentfem.toml", "*/README.md", "*/AGENTS.md"]

[tool.setuptools.exclude-package-data]
"*" = ["*.py[cod]", "__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The ``src/agentfem`` directory is the package source. Unit and MPI tests
# intentionally exercise the checkout; release_gate.py separately
# installs and verifies the exact wheel so the two evidence paths cannot be
# confused with a stale environment installation.
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
extend-exclude = [
  "build",
  "site",
  "verification",
  "examples/abaqus_c3d10h_periodic_cell/abaqus_reference",
]

[tool.ruff.lint]
# Begin with correctness defects rather than imposing a repository-wide style
# rewrite on established scientific code and imported reference scripts.
select = ["E9", "F63", "F7", "F82", "B023", "RUF009"]
