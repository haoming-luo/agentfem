name: Bug report / 问题报告
description: Tell us what went wrong; an AI agent may prepare this form for you
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve AgentFEM. English and Chinese are both welcome.
        Please remove confidential models, paths, results, credentials, and licensed files.
  - type: dropdown
    id: defect_kind
    attributes:
      label: Defect category
      options:
        - Installation or platform
        - Public API or validation
        - Mesh or boundary conditions
        - Material or operator
        - Solver, convergence, or MPI
        - Results, post-processing, or restart
        - Campaign, dataset, or ML bridge
        - Documentation
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What were you trying to do? / 你想完成什么？
      description: A short description is enough.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened? / 实际发生了什么？
      description: Include the shortest useful error message or screenshot.
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: How can we reproduce it? / 如何复现？
      description: List the steps, or attach a small public project with private data removed.
    validations:
      required: true
  - type: textarea
    id: runtime
    attributes:
      label: AgentFEM health check / 环境检查
      description: Ask your agent to run `agentfem doctor --json` and paste the result. It contains no model or result data.
      render: json
    validations:
      required: true
  - type: textarea
    id: diagnosis
    attributes:
      label: Optional diagnosis / 可选诊断
      description: For a failed project, paste the sanitized summary from `agentfem diagnose --json` if available.
      render: json
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing Issues or Q&A.
          required: true
        - label: I removed secrets, licensed files, and confidential engineering data.
          required: true
