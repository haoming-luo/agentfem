name: Windows installer contract
on:
  pull_request:
    paths: ['packaging/runtime/**', 'tests/windows/**', '.github/workflows/windows-installer-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer-contract:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v6
      - name: Exercise installer state and failure handling
        shell: ${{ matrix.shell }}
        run: ./tests/windows/installer_contract.ps1
