name: Windows installer contract
on:
  pull_request:
    paths: ['packaging/runtime/**', 'tests/windows/**', '.github/workflows/windows-installer-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Exercise PowerShell 5.1 installer state and failure handling
        shell: powershell
        run: ./tests/windows/installer_contract.ps1
      - name: Exercise PowerShell 7 installer state and failure handling
        shell: pwsh
        run: ./tests/windows/installer_contract.ps1
