name: Signed macOS runtime

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag, for example v0.3.1
        type: string
        required: true
      profile:
        description: Runtime profile
        type: choice
        required: true
        default: complete
        options:
          - complete
          - core
      publish_release:
        description: Upload the accepted notarized PKG to the existing release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  signed-macos-arm64:
    name: Sign, notarize and accept macOS ARM64 PKG
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Validate release identity and required secrets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_BUILD_KEYCHAIN_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${RELEASE_TAG}" = "v${VERSION}"
          test -n "${CERTIFICATE_P12}"
          test -n "${CERTIFICATE_PASSWORD}"
          test -n "${KEYCHAIN_PASSWORD}"
          test -n "${NOTARY_KEY_P8}"
          test -n "${NOTARY_KEY_ID}"
          test -n "${NOTARY_ISSUER_ID}"

      - name: Install release tooling
        run: |
          brew install miniforge
          "$(brew --prefix miniforge)/bin/conda" create -y -p build/runtime/constructor -c conda-forge constructor micromamba python=3.11 pip

      - name: Import Developer ID identities into an ephemeral keychain
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          python3 -c 'import base64,os,pathlib; pathlib.Path("build/runtime/developer-id.p12").write_bytes(base64.b64decode(os.environ["CERTIFICATE_P12"]))'
          security create-keychain -p "${KEYCHAIN_PASSWORD}" build/runtime/agentfem-signing.keychain-db
          security set-keychain-settings -lut 21600 build/runtime/agentfem-signing.keychain-db
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" build/runtime/agentfem-signing.keychain-db
          security list-keychains -d user -s build/runtime/agentfem-signing.keychain-db
          security default-keychain -d user -s build/runtime/agentfem-signing.keychain-db
          security import build/runtime/developer-id.p12 \
            -k build/runtime/agentfem-signing.keychain-db \
            -P "${CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" \
            build/runtime/agentfem-signing.keychain-db
          APP_IDENTITY="$(security find-identity -v -p codesigning build/runtime/agentfem-signing.keychain-db | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          INSTALLER_IDENTITY="$(security find-identity -v build/runtime/agentfem-signing.keychain-db | sed -n 's/.*"\(Developer ID Installer:[^"]*\)".*/\1/p' | head -1)"
          test -n "${APP_IDENTITY}"
          test -n "${INSTALLER_IDENTITY}"
          echo "AGENTFEM_APP_IDENTITY=${APP_IDENTITY}" >> "${GITHUB_ENV}"
          echo "AGENTFEM_INSTALLER_IDENTITY=${INSTALLER_IDENTITY}" >> "${GITHUB_ENV}"

      - name: Configure Apple notarization with an API key
        env:
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          printf '%s' "${NOTARY_KEY_P8}" > build/runtime/AuthKey.p8
          chmod 600 build/runtime/AuthKey.p8
          xcrun notarytool store-credentials agentfem-notary \
            --key build/runtime/AuthKey.p8 \
            --key-id "${NOTARY_KEY_ID}" \
            --issuer "${NOTARY_ISSUER_ID}"
          echo "AGENTFEM_NOTARY_PROFILE=agentfem-notary" >> "${GITHUB_ENV}"

      - name: Download the published wheel
        run: |
          VERSION="$(build/runtime/constructor/bin/python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          build/runtime/constructor/bin/python -m pip download \
            --only-binary=:all: --no-deps --dest dist "agentfem==${VERSION}"

      - name: Build, sign, notarize and staple the runtime
        env:
          CONSTRUCTOR_CONDA_EXE: ${{ github.workspace }}/build/runtime/constructor/bin/micromamba
        run: |
          build/runtime/constructor/bin/python packaging/runtime/build_runtime.py macos \
            --profile "${{ inputs.profile }}" \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"

      - name: Verify Apple trust state and installed runtime
        run: |
          PKG="$(find dist/runtime -maxdepth 1 -name '*.pkg' ! -name '*preview*' -print -quit)"
          test -n "${PKG}"
          pkgutil --check-signature "${PKG}" | tee dist/runtime/macos-signature.txt
          xcrun stapler validate "${PKG}" | tee dist/runtime/macos-notarization.txt
          spctl --assess --type install --verbose=4 "${PKG}"
          VERSION="$(build/runtime/constructor/bin/python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          PREFIX="${HOME}/Library/agentfemruntime-${VERSION}"
          /usr/sbin/installer -pkg "${PKG}" -target CurrentUserHomeDirectory
          "${PREFIX}/bin/python" packaging/runtime/verify_installed_runtime.py \
            --prefix "${PREFIX}" \
            --profile "${{ inputs.profile }}" \
            --output dist/runtime/macos-arm64-signed-acceptance.json
          build/runtime/constructor/bin/python packaging/runtime/build_runtime.py manifest

      - name: Upload signed candidate and evidence
        uses: actions/upload-artifact@v7
        with:
          name: agentfem-${{ inputs.profile }}-macos-arm64-signed
          path: dist/runtime/
          compression-level: 0

      - name: Publish the accepted notarized PKG
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null
          PKG="$(find dist/runtime -maxdepth 1 -name '*.pkg' ! -name '*preview*' -print -quit)"
          gh release upload "${RELEASE_TAG}" \
            "${PKG}" \
            dist/runtime/macos-arm64-signed-acceptance.json \
            dist/runtime/macos-signature.txt \
            dist/runtime/macos-notarization.txt \
            --clobber
