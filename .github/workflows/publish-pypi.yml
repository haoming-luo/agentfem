name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build the immutable release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build source and wheel distributions once
        run: python -m build

      - name: Validate metadata, payload, and release identity
        run: |
          python -m twine check dist/*
          python release_gate.py --dist dist --tag "${GITHUB_REF_NAME}"

      - name: Upload immutable candidate distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  verify:
    name: Verify the exact wheel users will receive
    needs: build
    runs-on: ubuntu-latest
    env:
      UCX_TLS: tcp,sm,self
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download immutable candidate distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-release
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Install the candidate wheel and optional mesh reader
        run: |
          python -m pip install meshio
          python -m pip install "mkdocs>=1.6,<2" "mkdocs-material>=9,<10" pymdown-extensions
          python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Validate documentation and machine entrypoints
        run: |
          python build_docs.py --check
          python -m mkdocs build --strict

      - name: Verify the wheel identity and release workflows
        run: |
          python release_gate.py --dist dist --tag "${GITHUB_REF_NAME}" --smoke \
            --report /tmp/agentfem-agent-acceptance.json \
            --platform-report /tmp/agentfem-platform-acceptance.json \
            --require-platform linux

      - name: Upload installed-use acceptance evidence
        uses: actions/upload-artifact@v7
        with:
          name: agent-acceptance-evidence
          path: |
            /tmp/agentfem-agent-acceptance.json
            /tmp/agentfem-platform-acceptance.json
          if-no-files-found: error

      - name: Validate versioned scientific knowledge
        run: python build_knowledge.py --check --check-imports

      - name: Run the complete serial suite
        run: python -m pytest

      - name: Run distributed constraint, fracture, and result tests
        run: mpirun -n 2 python -m pytest tests/test_parallel_affine.py tests/test_parallel_cli.py tests/test_parallel_cohesive.py tests/test_parallel_mesh_semantics.py tests/test_parallel_mixed.py tests/test_parallel_results.py tests/test_parallel_transient.py

      - name: Verify three-owner sparse cohesive exchange
        run: mpirun -n 3 python -m pytest tests/test_parallel_cohesive.py -k "interface_sparse or serial_nonuniform"

      - name: Verify checkpoint portability across MPI rank counts
        run: |
          mpirun -n 2 python tests/portable_checkpoint_driver.py write /tmp/agentfem-portable-heat
          python tests/portable_checkpoint_driver.py read /tmp/agentfem-portable-heat
          mpirun -n 2 python tests/portable_field_history_driver.py write /tmp/agentfem-portable-field-history
          python tests/portable_field_history_driver.py read /tmp/agentfem-portable-field-history.npz
          python tests/portable_field_history_driver.py write /tmp/agentfem-portable-field-history-reverse
          mpirun -n 2 python tests/portable_field_history_driver.py read /tmp/agentfem-portable-field-history-reverse.npz
          mpirun -n 2 python tests/portable_cohesive_checkpoint_driver.py write /tmp/agentfem-portable-cohesive
          python tests/portable_cohesive_checkpoint_driver.py read /tmp/agentfem-portable-cohesive
          mpirun -n 2 python tests/portable_mixed_cyclic_cohesive_driver.py write /tmp/agentfem-portable-mixed-cyclic
          python tests/portable_mixed_cyclic_cohesive_driver.py read /tmp/agentfem-portable-mixed-cyclic
          mpirun -n 2 python tests/portable_cohesive_checkpoint_driver.py reject-inconsistent /tmp/agentfem-inconsistent-cohesive
          mpirun -n 2 python tests/portable_cohesive_dynamics_driver.py write /tmp/agentfem-portable-cohesive-dynamics
          python tests/portable_cohesive_dynamics_driver.py read /tmp/agentfem-portable-cohesive-dynamics
          mpirun -n 2 python tests/portable_inelastic_quadrature_driver.py write /tmp/agentfem-portable-inelastic
          python tests/portable_inelastic_quadrature_driver.py read /tmp/agentfem-portable-inelastic
          mpirun -n 2 python tests/portable_inelastic_step_driver.py write /tmp/agentfem-portable-inelastic-step
          python tests/portable_inelastic_step_driver.py read /tmp/agentfem-portable-inelastic-step
          python tests/portable_inelastic_step_driver.py write /tmp/agentfem-portable-inelastic-step-reverse
          mpirun -n 2 python tests/portable_inelastic_step_driver.py read /tmp/agentfem-portable-inelastic-step-reverse
          mpirun -n 2 python tests/portable_finite_strain_j2_driver.py write /tmp/agentfem-portable-finite-strain-j2
          python tests/portable_finite_strain_j2_driver.py read /tmp/agentfem-portable-finite-strain-j2
          python tests/portable_finite_strain_j2_driver.py write /tmp/agentfem-portable-finite-strain-j2-reverse
          mpirun -n 2 python tests/portable_finite_strain_j2_driver.py read /tmp/agentfem-portable-finite-strain-j2-reverse
          mpirun -n 2 python tests/portable_affine_j2_periodic_driver.py write /tmp/agentfem-portable-affine-j2
          python tests/portable_affine_j2_periodic_driver.py read /tmp/agentfem-portable-affine-j2
          python tests/portable_affine_j2_periodic_driver.py write /tmp/agentfem-portable-affine-j2-reverse
          mpirun -n 2 python tests/portable_affine_j2_periodic_driver.py read /tmp/agentfem-portable-affine-j2-reverse
          mpirun -n 2 python tests/portable_affine_j2_periodic_driver.py write /tmp/agentfem-portable-affine-j2-regional --two-phase
          python tests/portable_affine_j2_periodic_driver.py read /tmp/agentfem-portable-affine-j2-regional --two-phase
          python tests/portable_affine_j2_periodic_driver.py write /tmp/agentfem-portable-affine-j2-regional-reverse --two-phase
          mpirun -n 2 python tests/portable_affine_j2_periodic_driver.py read /tmp/agentfem-portable-affine-j2-regional-reverse --two-phase

      - name: Verify distributed inelastic equilibrium and transactions
        run: mpirun -n 2 python -m pytest tests/test_parallel_inelastic.py -k distributed

      - name: Verify native axisymmetric J2 path with two MPI ranks
        run: mpirun -n 2 python tests/axisymmetric_mpi_driver.py

      - name: Verify finite-strain J2 global path with two MPI ranks
        run: mpirun -n 2 python tests/finite_strain_j2_mpi_driver.py

      - name: Verify finite-strain J2 non-proportional path with two MPI ranks
        run: mpirun -n 2 python tests/finite_strain_j2_path_mpi_driver.py

      - name: Verify external J2 structure across MPI rank counts
        run: |
          python tests/external_inelastic_benchmark_driver.py write /tmp/agentfem-j2-cylinder.json
          mpirun -n 2 python tests/external_inelastic_benchmark_driver.py compare /tmp/agentfem-j2-cylinder.json

  ml-verify:
    name: Verify the optional PyTorch bridge from the candidate wheel
    needs: build
    runs-on: ubuntu-latest
    env:
      UCX_TLS: tcp,sm,self
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download immutable candidate distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-release-ml
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Install the candidate wheel and official CPU PyTorch build
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify simulation-to-learning optional contracts
        run: |
          python -c "import torch, agentfem; print(torch.__version__, agentfem.__version__)"
          python -c "import agentfem, torch; print(agentfem.__version__, torch.__version__)"
          python -m pytest tests/test_datasets.py tests/test_surrogates.py

  attest:
    name: Attest the verified distributions
    needs: [verify, ml-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Attest official distribution provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"

      - name: Record private-repository attestation boundary
        if: github.event.repository.visibility != 'public'
        run: echo "GitHub artifact attestations require a public repository; publishing the verified immutable artifacts without a GitHub attestation."

  publish:
    name: Publish verified distributions to PyPI
    needs: attest
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
