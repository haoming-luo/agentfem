name: Test

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      validation_level:
        description: Minimum validation tier to run
        required: true
        default: release
        type: choice
        options:
          - docs
          - targeted
          - core
          - release
  push:
    branches: ["main"]
  pull_request:

# Cancellation belongs to evidence-equivalent jobs below, not to the whole
# workflow. A documentation-only follow-up must never cancel an in-flight core
# numerical gate that the follow-up itself will not rerun.

jobs:
  change-scope:
    name: Classify validation scope
    runs-on: ubuntu-latest
    outputs:
      numerical: ${{ steps.scope.outputs.numerical }}
      level: ${{ steps.scope.outputs.level }}
      ml: ${{ steps.scope.outputs.ml }}
      tests: ${{ steps.scope.outputs.tests }}
      mpi_tests: ${{ steps.scope.outputs.mpi_tests }}
    steps:
      - name: Check out enough history to classify the change
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select the minimum trustworthy validation tier
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_LEVEL: ${{ inputs.validation_level }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            python ci_validation_scope.py \
              --requested "${REQUESTED_LEVEL:-release}" \
              --github-output "${GITHUB_OUTPUT}"
            exit 0
          fi

          BASE_SHA="${PR_BASE_SHA:-${BEFORE_SHA}}"
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            python ci_validation_scope.py \
              --requested core \
              --github-output "${GITHUB_OUTPUT}"
            exit 0
          fi

          python ci_validation_scope.py \
            --base "${BASE_SHA}" \
            --head "${GITHUB_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  static-analysis:
    name: Python correctness lint
    needs: change-scope
    if: needs.change-scope.outputs.level != 'docs'
    runs-on: ubuntu-latest
    concurrency:
      group: test-static-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run source attribution and critical Ruff gates
        run: |
          python -m pip install "reuse>=5,<6" "ruff>=0.16,<0.17"
          reuse lint
          ruff check . --no-cache

      - name: Verify reliability collector schema boundary
        if: needs.change-scope.outputs.level != 'docs'
        run: |
          node --test services/reliability-collector/worker.test.mjs
          node --test services/reliability-relay-tencent/index.test.cjs

      - name: Parse the Windows runtime lifecycle scripts
        if: needs.change-scope.outputs.level != 'docs'
        shell: pwsh
        run: |
          foreach ($path in @(
            "packaging/runtime/wsl/Install-AgentFEM.ps1",
            "packaging/runtime/wsl/Remove-AgentFEM.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }
              exit 1
            }
          }

  documentation:
    name: Documentation and machine entrypoints
    needs: change-scope
    runs-on: ubuntu-latest
    concurrency:
      group: test-docs-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install documentation tools
        run: python -m pip install "mkdocs>=1.6,<2" "mkdocs-material>=9,<10" pymdown-extensions

      - name: Validate and build documentation
        run: |
          python build_docs.py --check
          python -m mkdocs build --strict

  fenicsx-targeted:
    name: Targeted FEniCSx regression
    needs: change-scope
    if: needs.change-scope.outputs.level == 'targeted'
    runs-on: ubuntu-latest
    concurrency:
      group: test-targeted-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      UCX_TLS: tcp,sm,self
      CHANGED_TESTS: ${{ needs.change-scope.outputs.tests }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-targeted
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Build and install the wheel under test
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install meshio
          python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Validate scientific knowledge inputs
        run: python build_knowledge.py --check --check-imports

      - name: Run affected tests or the stable workflow sentinel
        run: |
          if [[ -n "${CHANGED_TESTS}" ]]; then
            read -r -a selected <<< "${CHANGED_TESTS}"
          else
            selected=(tests/test_common_workflows.py tests/test_project_cli.py)
          fi
          python -m pytest -q "${selected[@]}"

      - name: Run serial and two-rank solver smoke tests
        run: |
          python examples/static_elasticity_2d.py
          mpirun -n 2 python examples/static_elasticity_2d.py

  fenicsx:
    needs: change-scope
    if: >-
      needs.change-scope.outputs.level == 'core' ||
      needs.change-scope.outputs.level == 'release'
    runs-on: ubuntu-latest
    concurrency:
      group: test-core-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Azure-hosted runners may expose a MANA verbs device that UCX discovers
    # but cannot initialize. The release path needs only local/shared-memory
    # and TCP transports, including the two-rank regression jobs below.
    env:
      UCX_TLS: tcp,sm,self
      VALIDATION_LEVEL: ${{ needs.change-scope.outputs.level }}
      CHANGED_TESTS: ${{ needs.change-scope.outputs.tests }}
      CHANGED_MPI_TESTS: ${{ needs.change-scope.outputs.mpi_tests }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-dev
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Build and install the wheel users receive
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          python release_gate.py --dist dist
          python -m pip install meshio
          python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Validate versioned scientific knowledge
        run: python build_knowledge.py --check --check-imports

      - name: Run unit and interface tests
        run: |
          if [[ "${VALIDATION_LEVEL}" == "core" && -n "${CHANGED_TESTS}" ]]; then
            read -r -a selected <<< "${CHANGED_TESTS}"
            python -m pytest -q "${selected[@]}"
          else
            python -m pytest
          fi

      - name: Run affected distributed owner tests
        if: >-
          needs.change-scope.outputs.level == 'core' &&
          needs.change-scope.outputs.mpi_tests != ''
        run: |
          read -r -a selected <<< "${CHANGED_MPI_TESTS}"
          mpirun -n 2 python -m pytest -q "${selected[@]}"

      - name: Run distributed constraint and result tests
        if: needs.change-scope.outputs.level == 'release'
        run: >-
          mpirun -n 2 python -m pytest
          tests/test_parallel_affine.py
          tests/test_parallel_cli.py
          tests/test_parallel_cohesive.py
          tests/test_parallel_learning.py
          tests/test_parallel_mesh_semantics.py
          tests/test_parallel_mixed.py
          tests/test_parallel_modal.py
          tests/test_parallel_results.py
          tests/test_parallel_transient.py
          tests/test_parallel_viscoelasticity.py

      - name: Verify three-dimensional block Stokes with two MPI ranks
        if: needs.change-scope.outputs.level == 'release'
        run: mpirun -n 2 python -m pytest tests/test_pdeagent_bench.py -k three_dimensional_stokes

      - name: Verify three-owner sparse cohesive exchange
        if: needs.change-scope.outputs.level == 'release'
        run: mpirun -n 3 python -m pytest tests/test_parallel_cohesive.py -k "interface_sparse or serial_nonuniform"

      - name: Verify checkpoint portability across MPI rank counts
        if: needs.change-scope.outputs.level == 'release'
        run: |
          mpirun -n 2 python tests/portable_checkpoint_driver.py write /tmp/agentfem-portable-heat
          python tests/portable_checkpoint_driver.py read /tmp/agentfem-portable-heat
          mpirun -n 2 python tests/portable_dpc_state_driver.py write /tmp/agentfem-portable-dpc
          python tests/portable_dpc_state_driver.py read /tmp/agentfem-portable-dpc
          python tests/portable_dpc_state_driver.py write /tmp/agentfem-portable-dpc-reverse
          mpirun -n 2 python tests/portable_dpc_state_driver.py read /tmp/agentfem-portable-dpc-reverse
          mpirun -n 2 python tests/portable_harmonic_sweep_driver.py write /tmp/agentfem-portable-harmonic
          python tests/portable_harmonic_sweep_driver.py read /tmp/agentfem-portable-harmonic
          python tests/portable_harmonic_sweep_driver.py write /tmp/agentfem-portable-harmonic-reverse
          mpirun -n 2 python tests/portable_harmonic_sweep_driver.py read /tmp/agentfem-portable-harmonic-reverse
          mpirun -n 2 python tests/portable_field_history_driver.py write /tmp/agentfem-portable-field-history
          python tests/portable_field_history_driver.py read /tmp/agentfem-portable-field-history.npz
          python tests/portable_field_history_driver.py write /tmp/agentfem-portable-field-history-reverse
          mpirun -n 2 python tests/portable_field_history_driver.py read /tmp/agentfem-portable-field-history-reverse.npz
          mpirun -n 2 python tests/portable_cohesive_checkpoint_driver.py write /tmp/agentfem-portable-cohesive
          python tests/portable_cohesive_checkpoint_driver.py read /tmp/agentfem-portable-cohesive
          mpirun -n 2 python tests/portable_mixed_cyclic_cohesive_driver.py write /tmp/agentfem-portable-mixed-cyclic
          python tests/portable_mixed_cyclic_cohesive_driver.py read /tmp/agentfem-portable-mixed-cyclic
          mpirun -n 2 python tests/portable_cohesive_checkpoint_driver.py reject-inconsistent /tmp/agentfem-inconsistent-cohesive
          mpirun -n 2 python tests/portable_cohesive_dynamics_driver.py write /tmp/agentfem-portable-cohesive-dynamics
          python tests/portable_cohesive_dynamics_driver.py read /tmp/agentfem-portable-cohesive-dynamics
          mpirun -n 2 python tests/portable_inelastic_quadrature_driver.py write /tmp/agentfem-portable-inelastic
          python tests/portable_inelastic_quadrature_driver.py read /tmp/agentfem-portable-inelastic
          mpirun -n 2 python tests/portable_inelastic_step_driver.py write /tmp/agentfem-portable-inelastic-step
          python tests/portable_inelastic_step_driver.py read /tmp/agentfem-portable-inelastic-step
          python tests/portable_inelastic_step_driver.py write /tmp/agentfem-portable-inelastic-step-reverse
          mpirun -n 2 python tests/portable_inelastic_step_driver.py read /tmp/agentfem-portable-inelastic-step-reverse
          mpirun -n 2 python tests/portable_viscoelastic_step_driver.py write /tmp/agentfem-portable-viscoelastic
          python tests/portable_viscoelastic_step_driver.py read /tmp/agentfem-portable-viscoelastic
          python tests/portable_viscoelastic_step_driver.py write /tmp/agentfem-portable-viscoelastic-reverse
          mpirun -n 2 python tests/portable_viscoelastic_step_driver.py read /tmp/agentfem-portable-viscoelastic-reverse
          mpirun -n 2 python tests/portable_finite_strain_j2_driver.py write /tmp/agentfem-portable-finite-strain-j2
          python tests/portable_finite_strain_j2_driver.py read /tmp/agentfem-portable-finite-strain-j2
          python tests/portable_finite_strain_j2_driver.py write /tmp/agentfem-portable-finite-strain-j2-reverse
          mpirun -n 2 python tests/portable_finite_strain_j2_driver.py read /tmp/agentfem-portable-finite-strain-j2-reverse
          mpirun -n 2 python tests/portable_affine_j2_periodic_driver.py write /tmp/agentfem-portable-affine-j2
          python tests/portable_affine_j2_periodic_driver.py read /tmp/agentfem-portable-affine-j2
          python tests/portable_affine_j2_periodic_driver.py write /tmp/agentfem-portable-affine-j2-reverse
          mpirun -n 2 python tests/portable_affine_j2_periodic_driver.py read /tmp/agentfem-portable-affine-j2-reverse
          mpirun -n 2 python tests/portable_affine_j2_periodic_driver.py write /tmp/agentfem-portable-affine-j2-regional --two-phase
          python tests/portable_affine_j2_periodic_driver.py read /tmp/agentfem-portable-affine-j2-regional --two-phase
          python tests/portable_affine_j2_periodic_driver.py write /tmp/agentfem-portable-affine-j2-regional-reverse --two-phase
          mpirun -n 2 python tests/portable_affine_j2_periodic_driver.py read /tmp/agentfem-portable-affine-j2-regional-reverse --two-phase

      - name: Verify distributed inelastic equilibrium and transactions
        if: needs.change-scope.outputs.level == 'release'
        run: mpirun -n 2 python -m pytest tests/test_parallel_inelastic.py -k distributed

      - name: Verify native axisymmetric J2 path with two MPI ranks
        if: needs.change-scope.outputs.level == 'release'
        run: mpirun -n 2 python tests/axisymmetric_mpi_driver.py

      - name: Verify finite-strain J2 global path with two MPI ranks
        if: needs.change-scope.outputs.level == 'release'
        run: mpirun -n 2 python tests/finite_strain_j2_mpi_driver.py

      - name: Verify finite-strain J2 non-proportional path with two MPI ranks
        if: needs.change-scope.outputs.level == 'release'
        run: mpirun -n 2 python tests/finite_strain_j2_path_mpi_driver.py

      - name: Verify true-void finite-strain J2 MPI invariants
        if: needs.change-scope.outputs.level == 'release'
        run: >-
          mpirun -n 2 python tests/parallel_periodic_void_j2_driver.py
          --invariants-only

      - name: Verify external J2 structure across MPI rank counts
        if: needs.change-scope.outputs.level == 'release'
        run: |
          python tests/external_inelastic_benchmark_driver.py write /tmp/agentfem-j2-cylinder.json
          mpirun -n 2 python tests/external_inelastic_benchmark_driver.py compare /tmp/agentfem-j2-cylinder.json

      - name: Verify NAFEMS LE10 3D elasticity across MPI rank counts
        if: needs.change-scope.outputs.level == 'release'
        run: |
          python tests/external_elasticity_3d_benchmark_driver.py write /tmp/agentfem-nafems-le10.json
          mpirun -n 2 python tests/external_elasticity_3d_benchmark_driver.py compare /tmp/agentfem-nafems-le10.json

      - name: Run static FEniCSx smoke test
        run: python examples/static_elasticity_2d.py

      - name: Run two-rank MPI smoke test
        run: mpirun -n 2 python examples/static_elasticity_2d.py

      - name: Run campaign/dataset/surrogate FEniCSx smoke test
        run: AGENTFEM_CAMPAIGN_SAMPLES=4 AGENTFEM_CAMPAIGN_RUN_ID=ci-serial python examples/static_elasticity_surrogate_campaign.py

      - name: Run campaign persistence with two MPI ranks
        if: needs.change-scope.outputs.level == 'release'
        run: AGENTFEM_CAMPAIGN_SAMPLES=4 AGENTFEM_CAMPAIGN_RUN_ID=ci-mpi mpirun -n 2 python examples/static_elasticity_surrogate_campaign.py

      - name: Run release demo smoke suite
        if: needs.change-scope.outputs.level == 'release'
        run: |
          python release_gate.py --dist dist --smoke \
            --report /tmp/agentfem-agent-acceptance.json \
            --platform-report /tmp/agentfem-platform-acceptance.json \
            --require-platform linux

      - name: Audit the 0.3 platform-promotion contract
        if: needs.change-scope.outputs.level == 'release'
        run: |
          python promotion_gate.py \
            --evidence /tmp/agentfem-agent-acceptance.json \
            --evidence /tmp/agentfem-platform-acceptance.json \
            --report /tmp/agentfem-platform-promotion.json

      - name: Upload agent acceptance evidence
        if: >-
          always() &&
          needs.change-scope.outputs.level == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: agent-acceptance-evidence
          path: |
            /tmp/agentfem-agent-acceptance.json
            /tmp/agentfem-platform-acceptance.json
            /tmp/agentfem-platform-promotion.json
          if-no-files-found: warn

      - name: Upload tested distributions
        if: >-
          always() &&
          needs.change-scope.outputs.level == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: tested-python-package-distributions
          path: dist/

  ml-optional:
    name: Optional PyTorch bridge
    needs: change-scope
    if: >-
      needs.change-scope.outputs.ml == 'true' ||
      needs.change-scope.outputs.level == 'release'
    runs-on: ubuntu-latest
    concurrency:
      group: test-ml-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Azure-hosted runners expose a MANA verbs device that UCX can select even
    # though it cannot create the required UD queue pair.  The ML bridge only
    # needs local/TCP MPI transports; pinning them also makes both library
    # import orders deterministic on the hosted runner.
    env:
      UCX_TLS: tcp,sm,self
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-ml
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Install the wheel and official CPU-only PyTorch build
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify simulation-to-learning optional contracts
        run: |
          python -c "import torch, agentfem; print(torch.__version__, agentfem.__version__)"
          python -c "import agentfem, torch; print(agentfem.__version__, torch.__version__)"
          python -m pytest tests/test_datasets.py tests/test_surrogates.py
