name: Test

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  static-analysis:
    name: Python correctness lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run the critical Ruff gate
        run: |
          python -m pip install "ruff>=0.16,<0.17"
          ruff check . --no-cache

  documentation:
    name: Documentation and machine entrypoints
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install documentation tools
        run: python -m pip install "mkdocs>=1.6,<2" "mkdocs-material>=9,<10" pymdown-extensions

      - name: Validate and build documentation
        run: |
          python build_docs.py --check
          python -m mkdocs build --strict

  fenicsx:
    runs-on: ubuntu-latest
    # Azure-hosted runners may expose a MANA verbs device that UCX discovers
    # but cannot initialize. The release path needs only local/shared-memory
    # and TCP transports, including the two-rank regression jobs below.
    env:
      UCX_TLS: tcp,sm,self
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-dev
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Build and install the wheel users receive
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          python release_gate.py --dist dist
          python -m pip install meshio
          python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Validate versioned scientific knowledge
        run: python build_knowledge.py --check --check-imports

      - name: Run unit and interface tests
        run: python -m pytest

      - name: Run distributed constraint and result tests
        run: mpirun -n 2 python -m pytest tests/test_parallel_affine.py tests/test_parallel_cli.py tests/test_parallel_cohesive.py tests/test_parallel_learning.py tests/test_parallel_mesh_semantics.py tests/test_parallel_mixed.py tests/test_parallel_results.py tests/test_parallel_transient.py

      - name: Verify three-dimensional block Stokes with two MPI ranks
        run: mpirun -n 2 python -m pytest tests/test_pdeagent_bench.py -k three_dimensional_stokes

      - name: Verify three-owner sparse cohesive exchange
        run: mpirun -n 3 python -m pytest tests/test_parallel_cohesive.py -k "interface_sparse or serial_nonuniform"

      - name: Verify checkpoint portability across MPI rank counts
        run: |
          mpirun -n 2 python tests/portable_checkpoint_driver.py write /tmp/agentfem-portable-heat
          python tests/portable_checkpoint_driver.py read /tmp/agentfem-portable-heat
          mpirun -n 2 python tests/portable_field_history_driver.py write /tmp/agentfem-portable-field-history
          python tests/portable_field_history_driver.py read /tmp/agentfem-portable-field-history.npz
          python tests/portable_field_history_driver.py write /tmp/agentfem-portable-field-history-reverse
          mpirun -n 2 python tests/portable_field_history_driver.py read /tmp/agentfem-portable-field-history-reverse.npz
          mpirun -n 2 python tests/portable_cohesive_checkpoint_driver.py write /tmp/agentfem-portable-cohesive
          python tests/portable_cohesive_checkpoint_driver.py read /tmp/agentfem-portable-cohesive
          mpirun -n 2 python tests/portable_mixed_cyclic_cohesive_driver.py write /tmp/agentfem-portable-mixed-cyclic
          python tests/portable_mixed_cyclic_cohesive_driver.py read /tmp/agentfem-portable-mixed-cyclic
          mpirun -n 2 python tests/portable_cohesive_checkpoint_driver.py reject-inconsistent /tmp/agentfem-inconsistent-cohesive
          mpirun -n 2 python tests/portable_cohesive_dynamics_driver.py write /tmp/agentfem-portable-cohesive-dynamics
          python tests/portable_cohesive_dynamics_driver.py read /tmp/agentfem-portable-cohesive-dynamics
          mpirun -n 2 python tests/portable_inelastic_quadrature_driver.py write /tmp/agentfem-portable-inelastic
          python tests/portable_inelastic_quadrature_driver.py read /tmp/agentfem-portable-inelastic
          mpirun -n 2 python tests/portable_inelastic_step_driver.py write /tmp/agentfem-portable-inelastic-step
          python tests/portable_inelastic_step_driver.py read /tmp/agentfem-portable-inelastic-step
          python tests/portable_inelastic_step_driver.py write /tmp/agentfem-portable-inelastic-step-reverse
          mpirun -n 2 python tests/portable_inelastic_step_driver.py read /tmp/agentfem-portable-inelastic-step-reverse

      - name: Verify distributed inelastic equilibrium and transactions
        run: mpirun -n 2 python -m pytest tests/test_parallel_inelastic.py -k distributed

      - name: Verify external J2 structure across MPI rank counts
        run: |
          python tests/external_inelastic_benchmark_driver.py write /tmp/agentfem-j2-cylinder.json
          mpirun -n 2 python tests/external_inelastic_benchmark_driver.py compare /tmp/agentfem-j2-cylinder.json

      - name: Run static FEniCSx smoke test
        run: python examples/static_elasticity_2d.py

      - name: Run two-rank MPI smoke test
        run: mpirun -n 2 python examples/static_elasticity_2d.py

      - name: Run campaign/dataset/surrogate FEniCSx smoke test
        run: AGENTFEM_CAMPAIGN_SAMPLES=4 AGENTFEM_CAMPAIGN_RUN_ID=ci-serial python examples/static_elasticity_surrogate_campaign.py

      - name: Run campaign persistence with two MPI ranks
        run: AGENTFEM_CAMPAIGN_SAMPLES=4 AGENTFEM_CAMPAIGN_RUN_ID=ci-mpi mpirun -n 2 python examples/static_elasticity_surrogate_campaign.py

      - name: Run release demo smoke suite
        run: |
          python release_gate.py --dist dist --smoke \
            --report /tmp/agentfem-agent-acceptance.json \
            --platform-report /tmp/agentfem-platform-acceptance.json \
            --require-platform linux

      - name: Audit the 0.3 platform-promotion contract
        run: |
          python promotion_gate.py \
            --evidence /tmp/agentfem-agent-acceptance.json \
            --evidence /tmp/agentfem-platform-acceptance.json \
            --report /tmp/agentfem-platform-promotion.json

      - name: Upload agent acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-acceptance-evidence
          path: |
            /tmp/agentfem-agent-acceptance.json
            /tmp/agentfem-platform-acceptance.json
            /tmp/agentfem-platform-promotion.json
          if-no-files-found: warn

      - name: Upload tested distributions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tested-python-package-distributions
          path: dist/

  ml-optional:
    name: Optional PyTorch bridge
    runs-on: ubuntu-latest
    # Azure-hosted runners expose a MANA verbs device that UCX can select even
    # though it cannot create the required UD queue pair.  The ML bridge only
    # needs local/TCP MPI transports; pinning them also makes both library
    # import orders deterministic on the hosted runner.
    env:
      UCX_TLS: tcp,sm,self
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-ml
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Install the wheel and official CPU-only PyTorch build
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify simulation-to-learning optional contracts
        run: |
          python -c "import torch, agentfem; print(torch.__version__, agentfem.__version__)"
          python -c "import agentfem, torch; print(agentfem.__version__, torch.__version__)"
          python -m pytest tests/test_datasets.py tests/test_surrogates.py
