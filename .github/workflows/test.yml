name: Test

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  fenicsx:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-dev
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Build and install the wheel users receive
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          python release_gate.py --dist dist
          python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Validate versioned scientific knowledge
        run: python build_knowledge.py --check --check-imports

      - name: Run unit and interface tests
        run: python -m pytest

      - name: Run distributed constraint and result tests
        run: mpirun -n 2 python -m pytest tests/test_parallel_affine.py tests/test_parallel_cli.py

      - name: Run static FEniCSx smoke test
        run: python examples/static_elasticity_2d.py

      - name: Run two-rank MPI smoke test
        run: mpirun -n 2 python examples/static_elasticity_2d.py

      - name: Run campaign/dataset/surrogate FEniCSx smoke test
        run: AGENTFEM_CAMPAIGN_SAMPLES=4 AGENTFEM_CAMPAIGN_RUN_ID=ci-serial python examples/static_elasticity_surrogate_campaign.py

      - name: Run campaign persistence with two MPI ranks
        run: AGENTFEM_CAMPAIGN_SAMPLES=4 AGENTFEM_CAMPAIGN_RUN_ID=ci-mpi mpirun -n 2 python examples/static_elasticity_surrogate_campaign.py

      - name: Run release demo smoke suite
        run: python release_gate.py --smoke

      - name: Upload tested distributions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tested-python-package-distributions
          path: dist/

  ml-optional:
    name: Optional PyTorch bridge
    runs-on: ubuntu-latest
    # Azure-hosted runners expose a MANA verbs device that UCX can select even
    # though it cannot create the required UD queue pair.  The ML bridge only
    # needs local/TCP MPI transports; pinning them also makes both library
    # import orders deterministic on the hosted runner.
    env:
      UCX_TLS: tcp,sm,self
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-ml
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Install the wheel and official CPU-only PyTorch build
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify simulation-to-learning optional contracts
        run: |
          python -c "import torch, agentfem; print(torch.__version__, agentfem.__version__)"
          python -c "import agentfem, torch; print(agentfem.__version__, torch.__version__)"
          python -m pytest tests/test_datasets.py tests/test_surrogates.py
