name: Scheduled scientific benchmarks

permissions:
  contents: read

on:
  schedule:
    # One expensive full-range external obligation per week, not on every push.
    - cron: "23 18 * * 6"
  workflow_dispatch:
    inputs:
      run_nafems_creep:
        description: Run the NAFEMS R0027 Test 7 creep comparison
        required: true
        type: boolean
        default: true
      radial_cells:
        description: NAFEMS cylinder radial cells
        required: true
        default: "4"
      angular_cells:
        description: NAFEMS cylinder angular cells
        required: true
        default: "8"
      increments:
        description: Initial physical-time increments
        required: true
        default: "40"
      run_multi_void_rve_load_path:
        description: Run the finite-strain multi-void 2/4/8-increment certificate
        required: true
        type: boolean
        default: false
      run_chaboche_ratcheting:
        description: Run the shouldered 316-steel ratcheting convergence certificate
        required: true
        type: boolean
        default: false
      run_chaboche_full_reference:
        description: Run the complete 100-cycle shouldered-specimen evidence
        required: true
        type: boolean
        default: false

jobs:
  nafems-creep:
    if: ${{ inputs.run_nafems_creep }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UCX_TLS: tcp,sm,self
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-benchmark
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Install the exact candidate wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Run NAFEMS R0027 Test 7 without automatic promotion
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/tools/run_nafems_creep_benchmark.py" \
            --radial-cells "${{ inputs.radial_cells }}" \
            --angular-cells "${{ inputs.angular_cells }}" \
            --increments "${{ inputs.increments }}" \
            --report /tmp/nafems-r0027-test7.json

      - name: Upload source-identified benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nafems-r0027-test7
          path: /tmp/nafems-r0027-test7.json
          if-no-files-found: warn

  finite-strain-rve-load-path:
    if: ${{ inputs.run_multi_void_rve_load_path }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UCX_TLS: tcp,sm,self
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-benchmark
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Install the exact candidate wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Run fixed-mesh 2/4/8-increment paths from the installed wheel
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/tests/multi_void_rve_golden_driver.py" \
            --mesh-size 0.16 --increments 2 \
            --output /tmp/agentfem-multi-void-n2.json
          python "$GITHUB_WORKSPACE/tests/multi_void_rve_golden_driver.py" \
            --mesh-size 0.16 --increments 4 \
            --output /tmp/agentfem-multi-void-n4.json
          python "$GITHUB_WORKSPACE/tests/multi_void_rve_golden_driver.py" \
            --mesh-size 0.16 --increments 8 \
            --output /tmp/agentfem-multi-void-n8.json
          python "$GITHUB_WORKSPACE/tests/multi_void_rve_golden_driver.py" \
            --compare-load-path \
            /tmp/agentfem-multi-void-n2.json \
            /tmp/agentfem-multi-void-n4.json \
            /tmp/agentfem-multi-void-n8.json \
            --output /tmp/agentfem-multi-void-load-path-certificate.json

      - name: Upload finite-strain RVE load-path evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: finite-strain-rve-load-path
          path: |
            /tmp/agentfem-multi-void-n2.json
            /tmp/agentfem-multi-void-n4.json
            /tmp/agentfem-multi-void-n8.json
            /tmp/agentfem-multi-void-load-path-certificate.json
          if-no-files-found: warn

  chaboche-ratcheting:
    if: ${{ inputs.run_chaboche_ratcheting }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UCX_TLS: tcp,sm,self
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-benchmark
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Install the exact candidate wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Run independent mesh and adaptive-path accuracy certificate
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/tools/run_chaboche_ratcheting_benchmark.py" \
            --cycles 5 \
            --mesh-sizes 3.5 2.5 \
            --maximum-inelastic-increments 0.004 0.002 0.001 \
            --relative-tolerance 0.01 \
            --report /tmp/agentfem-chaboche-ratcheting.json \
            --summary-only \
            --require-acceptable

      - name: Upload shouldered-specimen evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaboche-ratcheting-accuracy
          path: /tmp/agentfem-chaboche-ratcheting.json
          if-no-files-found: warn

  chaboche-ratcheting-full-reference:
    if: ${{ github.event_name == 'schedule' || inputs.run_chaboche_full_reference }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UCX_TLS: tcp,sm,self
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-benchmark
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Install the exact candidate wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Run the complete public 100-cycle response
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/tools/run_chaboche_ratcheting_benchmark.py" \
            --full-reference \
            --cycles 100 \
            --mesh-sizes 2.5 \
            --maximum-inelastic-increments 0.001 \
            --report /tmp/agentfem-chaboche-ratcheting-full-reference.json \
            --summary-only \
            --require-acceptable

      - name: Upload complete shouldered-specimen evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaboche-ratcheting-full-reference
          path: /tmp/agentfem-chaboche-ratcheting-full-reference.json
          if-no-files-found: warn
