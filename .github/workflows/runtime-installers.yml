name: Runtime installer previews

permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      profile:
        description: Runtime profile
        type: choice
        required: true
        default: complete
        options:
          - complete
          - core
      release_tag:
        description: Existing tag; blank uses v<project version>
        type: string
        required: false
      publish_release:
        description: Upload accepted previews to the matching GitHub Release
        type: boolean
        required: true
        default: false

env:
  RUNTIME_PROFILE: ${{ github.event_name == 'workflow_run' && 'complete' || inputs.profile }}
  RUNTIME_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_tag || github.ref }}

jobs:
  macos-arm64:
    name: macOS ARM64 PKG
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push') }}
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RUNTIME_REF }}

      - name: Install release tooling
        run: |
          brew install miniforge
          "$(brew --prefix)/bin/conda" create -y -p build/runtime/constructor -c conda-forge constructor micromamba python=3.11 pip

      - name: Download the published release wheel
        run: |
          VERSION="$(build/runtime/constructor/bin/python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          build/runtime/constructor/bin/python -m pip download \
            --only-binary=:all: --no-deps --dest dist "agentfem==$VERSION"

      - name: Build the unsigned preview runtime
        env:
          CONSTRUCTOR_CONDA_EXE: ${{ github.workspace }}/build/runtime/constructor/bin/micromamba
        run: |
          build/runtime/constructor/bin/python packaging/runtime/build_runtime.py macos \
            --profile "${RUNTIME_PROFILE}" \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"

      - name: Install and accept the macOS runtime
        run: |
          PKG="$(find dist/runtime -maxdepth 1 -name '*.pkg' -print -quit)"
          VERSION="$(build/runtime/constructor/bin/python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          PREFIX="$HOME/Library/agentfemruntime-$VERSION"
          /usr/sbin/installer -pkg "$PKG" -target CurrentUserHomeDirectory
          "$PREFIX/bin/python" packaging/runtime/verify_installed_runtime.py \
              --prefix "$PREFIX" \
              --profile "${RUNTIME_PROFILE}" \
              --output dist/runtime/macos-arm64-acceptance.json
          build/runtime/constructor/bin/python packaging/runtime/build_runtime.py manifest

      - name: Verify package signature state
        run: |
          PKG="$(find dist/runtime -maxdepth 1 -name '*.pkg' -print -quit)"
          if ! pkgutil --check-signature "$PKG"; then
            case "$PKG" in
              *-unsigned-preview.pkg) ;;
              *) exit 1 ;;
            esac
          fi

      - name: Upload macOS candidate and evidence
        uses: actions/upload-artifact@v7
        with:
          name: agentfem-${{ env.RUNTIME_PROFILE }}-macos-arm64
          path: dist/runtime/
          compression-level: 0

  wsl2-x86-64:
    name: WSL2 x86-64 image
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RUNTIME_REF }}

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: runtime-builder
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict

      - name: Install release tooling and download published wheel
        shell: bash -el {0}
        run: |
          conda install -y constructor pip
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -m pip download \
            --only-binary=:all: --no-deps --dest dist "agentfem==$VERSION"

      - name: Build the offline WSL image
        shell: bash -el {0}
        run: |
          python packaging/runtime/build_runtime.py wsl \
            --profile "${RUNTIME_PROFILE}" \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"

      - name: Accept the Linux runtime inside its image
        shell: bash -el {0}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker run --rm \
            --volume "$PWD/packaging/runtime/verify_installed_runtime.py:/tmp/verify_installed_runtime.py:ro" \
            --volume "$PWD/dist/runtime:/evidence" \
            "agentfem-runtime:$VERSION-${RUNTIME_PROFILE}-wsl2-amd64" \
            /opt/conda/bin/python /tmp/verify_installed_runtime.py \
              --prefix /opt/conda \
              --profile "${RUNTIME_PROFILE}" \
              --output /evidence/wsl2-container-acceptance.json
          python packaging/runtime/build_runtime.py manifest

      - name: Upload WSL candidate and evidence
        uses: actions/upload-artifact@v7
        with:
          name: agentfem-${{ env.RUNTIME_PROFILE }}-wsl2-x86-64
          path: dist/runtime/
          compression-level: 0

  publish-previews:
    name: Publish runtime previews
    needs: [macos-arm64, wsl2-x86-64]
    if: >-
      ${{ always() && needs.macos-arm64.result == 'success' &&
          needs.wsl2-x86-64.result == 'success' &&
          (github.event_name == 'workflow_run' || inputs.publish_release) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release identity
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RUNTIME_REF }}

      - name: Download accepted runtime previews
        uses: actions/download-artifact@v8
        with:
          pattern: agentfem-${{ env.RUNTIME_PROFILE }}-*
          path: release-input

      - name: Prepare compact preview assets
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          CHINA_MIRROR_BASE_URL: ${{ vars.AGENTFEM_CHINA_MIRROR_BASE_URL }}
          CHINA_MIRROR_S3_URI: ${{ vars.AGENTFEM_CHINA_MIRROR_S3_URI }}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG="${REQUESTED_TAG:-v${VERSION}}"
          test "${TAG}" = "v${VERSION}"
          echo "RUNTIME_RELEASE_TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "RUNTIME_RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          mkdir -p release-assets
          find release-input -type f -name '*-unsigned-preview.pkg' -exec cp {} release-assets/ \;
          find release-input -type f -name '*-preview-offline.zip' -exec cp {} release-assets/ \;
          find release-input -type f -name '*acceptance.json' -exec cp {} release-assets/ \;
          test "$(find release-assets -type f -name '*.pkg' | wc -l)" -eq 1
          test "$(find release-assets -type f -name '*.zip' | wc -l)" -eq 1
          python packaging/runtime/build_runtime.py manifest --output-dir release-assets
          DISTRIBUTION_ARGS=(
            release-assets/runtime-artifacts.json
            --output release-assets/distribution-manifest.json
            --official "github=https://github.com/haoming-luo/agentfem/releases/download/${TAG}"
          )
          if [[ -n "${CHINA_MIRROR_BASE_URL}" || -n "${CHINA_MIRROR_S3_URI}" ]]; then
            test -n "${CHINA_MIRROR_BASE_URL}"
            test -n "${CHINA_MIRROR_S3_URI}"
            DISTRIBUTION_ARGS+=(
              --mirror "china=${CHINA_MIRROR_BASE_URL%/}/${TAG}"
            )
          fi
          python packaging/runtime/distribution.py "${DISTRIBUTION_ARGS[@]}"

      - name: Publish byte-identical mainland mirror
        if: ${{ vars.AGENTFEM_CHINA_MIRROR_S3_URI != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AGENTFEM_CHINA_MIRROR_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AGENTFEM_CHINA_MIRROR_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AGENTFEM_CHINA_MIRROR_REGION || 'auto' }}
          MIRROR_ENDPOINT: ${{ vars.AGENTFEM_CHINA_MIRROR_ENDPOINT }}
          MIRROR_S3_URI: ${{ vars.AGENTFEM_CHINA_MIRROR_S3_URI }}
        run: |
          test -n "${AWS_ACCESS_KEY_ID}"
          test -n "${AWS_SECRET_ACCESS_KEY}"
          test -n "${MIRROR_ENDPOINT}"
          aws s3 sync release-assets/ "${MIRROR_S3_URI%/}/${RUNTIME_RELEASE_TAG}/" \
            --endpoint-url "${MIRROR_ENDPOINT}" \
            --no-progress \
            --only-show-errors

      - name: Publish accepted assets and download routes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${RUNTIME_RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RUNTIME_RELEASE_TAG}" \
              --verify-tag \
              --title "AgentFEM ${RUNTIME_RELEASE_VERSION}" \
              --generate-notes
          fi
          gh release upload "${RUNTIME_RELEASE_TAG}" release-assets/* --clobber
