name: Runtime installer candidates

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Runtime profile
        type: choice
        required: true
        default: complete
        options:
          - complete
          - core

jobs:
  macos-arm64:
    name: macOS ARM64 PKG
    runs-on: macos-14
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install release tooling
        run: |
          brew install miniforge
          "$(brew --prefix miniforge)/bin/conda" create -y -p build/runtime/constructor -c conda-forge constructor python=3.11 pip

      - name: Download the published release wheel
        run: |
          VERSION="$(build/runtime/constructor/bin/python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          build/runtime/constructor/bin/python -m pip download \
            --only-binary=:all: --no-deps --dest dist "agentfem==$VERSION"

      - name: Import optional Developer ID identities
        if: ${{ env.HAS_APPLE_CERTIFICATE == 'true' }}
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          python -c 'import base64,os,pathlib; pathlib.Path("build/runtime/developer-id.p12").write_bytes(base64.b64decode(os.environ["CERTIFICATE_P12"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import build/runtime/developer-id.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Configure optional Apple notarization
        if: ${{ env.HAS_APPLE_NOTARY == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: >-
          xcrun notarytool store-credentials agentfem-notary
          --apple-id "$APPLE_ID"
          --team-id "$APPLE_TEAM_ID"
          --password "$APPLE_APP_PASSWORD"

      - name: Build the pinned runtime
        env:
          AGENTFEM_NOTARY_PROFILE: ${{ secrets.APPLE_ID != '' && 'agentfem-notary' || '' }}
        run: |
          APP_IDENTITY="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          INSTALLER_IDENTITY="$(security find-identity -v -p basic | sed -n 's/.*"\(Developer ID Installer:[^"]*\)".*/\1/p' | head -1)"
          export AGENTFEM_APP_IDENTITY="$APP_IDENTITY"
          export AGENTFEM_INSTALLER_IDENTITY="$INSTALLER_IDENTITY"
          build/runtime/constructor/bin/python packaging/runtime/build_runtime.py macos \
            --profile "${{ inputs.profile }}" \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"

      - name: Install and accept the macOS runtime
        run: |
          PKG="$(find dist/runtime -maxdepth 1 -name '*.pkg' -print -quit)"
          VERSION="$(build/runtime/constructor/bin/python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          PREFIX="$HOME/Library/agentfemruntime-$VERSION"
          /usr/sbin/installer -pkg "$PKG" -target CurrentUserHomeDirectory
          "$PREFIX/bin/python" packaging/runtime/verify_installed_runtime.py \
            --prefix "$PREFIX" \
            --profile "${{ inputs.profile }}" \
            --output dist/runtime/macos-arm64-acceptance.json
          build/runtime/constructor/bin/python packaging/runtime/build_runtime.py manifest

      - name: Verify package signature state
        run: |
          PKG="$(find dist/runtime -maxdepth 1 -name '*.pkg' -print -quit)"
          if ! pkgutil --check-signature "$PKG"; then
            case "$PKG" in
              *-unsigned.pkg) ;;
              *) exit 1 ;;
            esac
          fi

      - name: Upload macOS candidate and evidence
        uses: actions/upload-artifact@v7
        with:
          name: agentfem-${{ inputs.profile }}-macos-arm64
          path: dist/runtime/
          compression-level: 0

  wsl2-x86-64:
    name: WSL2 x86-64 image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: runtime-builder
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict

      - name: Install release tooling and download published wheel
        shell: bash -el {0}
        run: |
          conda install -y constructor pip
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -m pip download \
            --only-binary=:all: --no-deps --dest dist "agentfem==$VERSION"

      - name: Build the offline WSL image
        shell: bash -el {0}
        run: |
          python packaging/runtime/build_runtime.py wsl \
            --profile "${{ inputs.profile }}" \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"

      - name: Accept the Linux runtime inside its image
        shell: bash -el {0}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker run --rm \
            --volume "$PWD/packaging/runtime/verify_installed_runtime.py:/tmp/verify_installed_runtime.py:ro" \
            --volume "$PWD/dist/runtime:/evidence" \
            "agentfem-runtime:$VERSION-${{ inputs.profile }}-wsl2-amd64" \
            /opt/conda/bin/python /tmp/verify_installed_runtime.py \
              --prefix /opt/conda \
              --profile "${{ inputs.profile }}" \
              --output /evidence/wsl2-container-acceptance.json
          python packaging/runtime/build_runtime.py manifest

      - name: Upload WSL candidate and evidence
        uses: actions/upload-artifact@v7
        with:
          name: agentfem-${{ inputs.profile }}-wsl2-x86-64
          path: dist/runtime/
          compression-level: 0
