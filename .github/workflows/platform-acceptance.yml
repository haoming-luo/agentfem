name: Platform acceptance

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  installed-wheel:
    name: Installed wheel (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    env:
      UCX_TLS: tcp,sm,self
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-platform
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Build and install one immutable candidate
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m pip install meshio
          python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Run installed-use platform acceptance
        run: |
          python release_gate.py --dist dist --smoke --mpi-ranks 2 \
            --report /tmp/agentfem-agent-acceptance.json \
            --platform-report /tmp/agentfem-platform-acceptance.json \
            --require-platform "${{ matrix.platform }}"

      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-acceptance-${{ matrix.platform }}
          path: |
            /tmp/agentfem-agent-acceptance.json
            /tmp/agentfem-platform-acceptance.json
          if-no-files-found: error

  evidence-audit:
    name: Aggregate hosted platform evidence
    needs: installed-wheel
    if: always()
    runs-on: ubuntu-latest
    env:
      UCX_TLS: tcp,sm,self
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - name: Create read-only promotion audit environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-promotion
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Download platform evidence
        uses: actions/download-artifact@v8
        with:
          pattern: platform-acceptance-*
          path: /tmp/agentfem-promotion-evidence

      - name: Audit evidence without relabelling missing WSL2 or agent trials
        run: |
          PYTHONPATH="$PWD/src" python promotion_gate.py \
            --evidence-directory /tmp/agentfem-promotion-evidence \
            --report /tmp/agentfem-platform-promotion.json

      - name: Upload promotion snapshot
        uses: actions/upload-artifact@v7
        with:
          name: platform-promotion-snapshot
          path: /tmp/agentfem-platform-promotion.json
          if-no-files-found: error
