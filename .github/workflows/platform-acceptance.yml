name: Platform acceptance

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  installed-wheel:
    name: Installed wheel (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    env:
      UCX_TLS: tcp,sm,self
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6

      - name: Create FEniCSx environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: agentfem-platform
          environment-file: environment.yml
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: strict

      - name: Build and install one immutable candidate
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m pip install meshio
          python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Run installed-use platform acceptance
        run: |
          python release_gate.py --dist dist --smoke \
            --report /tmp/agentfem-agent-acceptance.json \
            --platform-report /tmp/agentfem-platform-acceptance.json

      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-acceptance-${{ matrix.platform }}
          path: /tmp/agentfem-platform-acceptance.json
          if-no-files-found: error
