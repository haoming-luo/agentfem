{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page and page.meta and page.meta.citation_title %}
    <meta name="citation_title" content="{{ page.meta.citation_title }}">
    <meta name="citation_author" content="{{ page.meta.citation_author }}">
    <meta name="citation_publication_date" content="{{ page.meta.citation_publication_date }}">
    <meta name="citation_pdf_url" content="{{ page.meta.citation_pdf_url }}">
    <meta name="citation_technical_report_institution" content="{{ page.meta.citation_institution }}">
    <meta name="DC.title" content="{{ page.meta.citation_title }}">
    <meta name="DC.creator" content="{{ page.meta.citation_author }}">
    <meta name="DC.date" content="{{ page.meta.citation_publication_date }}">
    <meta name="DC.type" content="Text">
  {% endif %}
{% endblock %}
