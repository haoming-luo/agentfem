name: agentfem-dev
channels:
  - conda-forge
dependencies:
  - python=3.11
  - fenics-dolfinx=0.11
  - dolfinx_mpc=0.11
  - mpich
  - mpi4py
  - petsc4py
  - h5py
  # CI exercises optional CAD/true-void fixtures; AgentFEM runtime stays optional.
  # The `gmsh` output now carries the executable/library; `python-gmsh`
  # depends on it and provides the Python API exercised by the fixtures.
  - python-gmsh
  - numpy
  - scipy
  - pyamg
  - pytest
  - pip
