name: agentfem-dev
channels:
  - conda-forge
dependencies:
  - python=3.11
  - fenics-dolfinx=0.11
  - dolfinx_mpc=0.11
  - mpich
  - mpi4py
  - petsc4py
  # Modal analysis is optional; SciPy is a required numerical dependency.
  - slepc4py
  - scipy
  - h5py
  # Explicit native-contact CI input; setup remains optional without GMP.
  - gmp
  # Standard tools: installed by default, imported only when used.
  - gmsh
  - python-gmsh
  - matplotlib-base
  - numpy
  - packaging
  - pytest
  - pip
