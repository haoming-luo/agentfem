name: agentfem-dev
channels:
  - conda-forge
dependencies:
  - python=3.11
  - fenics-dolfinx=0.11
  - dolfinx_mpc=0.11
  - mpich
  - mpi4py
  - petsc4py
  # Modal analysis and transparent fixed-spectrum identification are optional
  # at runtime, but form part of the development verification matrix.
  - slepc4py
  - scipy
  - h5py
  # CI exercises optional CAD/true-void fixtures; AgentFEM runtime stays optional.
  - gmsh
  - python-gmsh
  - numpy
  - pytest
  - pip
