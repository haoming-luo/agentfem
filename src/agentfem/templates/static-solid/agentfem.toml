[project]
name = "{{PROJECT_NAME}}"
entrypoint = "case.py"
schema_version = "0.2.0"
created_with = "{{AGENTFEM_VERSION}}"

[run]
output_directory = "outputs"
default_profile = "local"

[execution.local]
runtime = "auto"
ranks = 1

[execution.cluster]
runtime = "fenicsx-petsc"
ranks = 2
required_capabilities = ["mpi_distributed_mesh"]
